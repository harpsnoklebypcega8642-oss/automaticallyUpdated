<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <link rel="preload" href="main.dart.js" as="script">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="小火箭">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>小火箭</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #xhj-bootstrap-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #7b68ee 0%, #f7f8fc 72%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity .2s ease;
    }
    #xhj-bootstrap-splash.is-hidden { opacity: 0; pointer-events: none; }
    #xhj-bootstrap-splash__content { text-align: center; }
    #xhj-bootstrap-splash__spinner {
      width: 22px;
      height: 22px;
      margin: 20px auto 0;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: xhj-bootstrap-spin .8s linear infinite;
    }
    @keyframes xhj-bootstrap-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="xhj-bootstrap-splash" role="status" aria-live="polite">
    <div id="xhj-bootstrap-splash__content">
      <div>欢迎使用小火箭</div>
      <div id="xhj-bootstrap-splash__spinner" aria-label="正在加载"></div>
    </div>
  </div>
  <script src="fingerprintjs.iife.min.js"></script>
  <script src="device_code_bridge.js"></script>
  <script src="pwa_install_bridge.js"></script>
  <script src="onesignal_web_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.setTimeout(function () {
      var splash = document.getElementById('xhj-bootstrap-splash');
      if (splash) splash.remove();
    }, 20000);
  </script>
</body>

</html>
