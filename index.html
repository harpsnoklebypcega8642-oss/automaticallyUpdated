<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            /* 关键：防止 iOS 橡皮箝效果干扰连击 */
            -webkit-overflow-scrolling: touch;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(125deg, #00ff8866, #00ffff66, #ff00ff66);
            animation: gradientMove 15s ease infinite;
            z-index: -1;
            filter: blur(100px);
            background-size: 400% 400%;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; transform: translateZ(0); }
            25% { background-position: 100% 50%; transform: translateZ(0); }
            50% { background-position: 50% 100%; transform: translateZ(0); }
            75% { background-position: 0% 50%; transform: translateZ(0); }
        }

        .container {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 1200px;
            z-index: 1;
        }

        /* Logo 触发器样式优化 */
        .logo-trigger {
            display: inline-block;
            touch-action: manipulation;
            cursor: default;
            /* 禁用 iOS 长按菜单和选择 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 0;
            pointer-events: none; /* 让事件由父级容器处理 */
        }

        h1 { font-size: 2em; margin: 20px 0 15px; }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin: 30px auto;
        }

        .button-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .download-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            min-width: 200px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .android { background: #3DDC84; box-shadow: 0 4px 15px rgba(61, 220, 132, 0.3); }
        .ios { background: #007AFF; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .windows { background: #00A4EF; box-shadow: 0 4px 15px rgba(0, 164, 239, 0.3); }
        .web { background: #FF9900; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3); }
        .mobile-web { background: #FF66CC; box-shadow: 0 4px 15px rgba(255, 102, 204, 0.3); }

        .download-button:active { transform: scale(0.95); }

        .button-text { display: flex; flex-direction: column; text-align: left; }
        .button-text small { font-size: 0.8rem; opacity: 0.9; }
        .button-text strong { font-size: 1.1rem; }

        /* 特色卡片 */
        .features { margin-top: 50px; padding: 0 20px; width: 100%; box-sizing: border-box; }
        .feature-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        /* 主题切换 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            z-index: 1000;
        }
        
        body.light-theme { background: #f5f5f5; color: #333; }
        .light-theme .theme-toggle { color: #333; }
        .light-theme .feature-card { background: rgba(0,0,0,0.05); }

        @media (max-width: 768px) {
            .button-row { flex-direction: column; width: 100%; }
            .download-button { width: 90%; max-width: 280px; margin: 0 auto; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        // --- 核心跳转逻辑 ---
        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        function handleIOSDownload(event, url, channel) {
            if (event) event.preventDefault();
            const isMobile = isMobileDevice();
            let targetUrl = isMobile ? './apple/install.html' : './apple/index.html';
            if (channel) targetUrl += '?channel=' + channel;
            window.location.href = targetUrl;
        }

        // --- 核心隐藏触发器逻辑 (适配 Safari 移动端) ---
        let logoClickCount = 0;
        let lastClickTime = 0;

        function handleSecretClick(event) {
            const currentTime = Date.now();
            
            // 移动端 Safari 连击判定优化：如果两次触摸超过 800ms 则视为重置
            if (currentTime - lastClickTime > 800) {
                logoClickCount = 0;
            }
            
            lastClickTime = currentTime;
            logoClickCount++;

            // 达到 5 次触发
            if (logoClickCount >= 5) {
                logoClickCount = 0; // 重置
                
                // 震动反馈 (部分安卓支持)
                if (navigator.vibrate) navigator.vibrate(50);
                
                // 执行隐藏跳转（渠道2）
                handleIOSDownload(event, './apple/index.html', '2');
                
                // 彻底阻止事件冒泡和后续 click
                if (event.cancelable) event.preventDefault();
                event.stopPropagation();
            }
        }

        // --- 主题切换逻辑 ---
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            themeIcon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // 初始化主题
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            themeIcon.className = 'fas fa-sun';
        }
    </script>
