<!DOCTYPE html>
<html>
<head>
	<title>dplayer播放器</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" id="viewport" name="viewport">
	<style type="text/css">
	html,body{width:100%;height:100%; padding:0; margin:0;}
	#playerCnt{width:100%;height:100%;}
	.dplayer-loading{display: none !important;}
	</style>
	<link rel="stylesheet" href="/static/player/dplayer/DPlayer.min.css">
	<script type="text/javascript" src="/static/player/dplayer/flv.min.js"></script>
	<script type="text/javascript" src="/static/player/dplayer/hls.min.js"></script>
	<script type="text/javascript" src="/static/player/dplayer/dash.all.min.js"></script>
	<script type="text/javascript" src="/static/player/dplayer/webtorrent.min.js"></script>
	<script type="text/javascript" src="/static/player/dplayer/DPlayer.min.js"></script>
</head>
<body marginwidth="0" marginheight="0">
<div id="playerCnt"></div>
<script type="text/javascript">
    var type='normal';
    var live=false;
    if(parent.MacPlayer.PlayUrl.indexOf('.m3u8')>-1){
        type='hls';
        live=true;
    }
    else if(parent.MacPlayer.PlayUrl.indexOf('magnet:')>-1){
        type='webtorrent';
    }
    else if(parent.MacPlayer.PlayUrl.indexOf('.flv')>-1){
        type='flv';
    }
    else if(parent.MacPlayer.PlayUrl.indexOf('.mpd')>-1){
        type='dash';
    }

    var dp = new DPlayer({
        container: document.getElementById('playerCnt'),
        autoplay: true,
        screenshot: false,
        video: {
            url: parent.MacPlayer.PlayUrl,
            live: live,
            type:type
        },
        contextmenu: [

        ]
    });
    
    dp.on('ended',function(){
　　　　if(parent.MacPlayer.PlayLinkNext!=''){
            top.location.href = parent.MacPlayer.PlayLinkNext;
        }
　　});

    dp.on('waiting', function() {
        showCustomBuffering();
    });
    dp.on('seeking', function() {
        showCustomBuffering();
    });
    dp.on('canplay', function() {
        hideCustomBuffering();
    });
    dp.on('seeked', function() {
        hideCustomBuffering();
    });

    (function () {
        var LIMIT = 15 * 60;
        var modalCooldown = false;

        try {
            if (parent.PopopGrowth && parent.PopopGrowth.config) {
                LIMIT = parent.PopopGrowth.config.limitSeconds || LIMIT;
            }
        } catch (e) {}

        function isInsideApp() {
            try {
                if (parent.PopopGrowth && parent.PopopGrowth.isInsideApp()) {
                    return true;
                }
                if (typeof parent.PopopApp !== 'undefined') {
                    return true;
                }
            } catch (e) {}
            return navigator.userAgent.indexOf('Popop_Client') > -1;
        }

        function notifyLimit() {
            try {
                if (parent.PopopGrowth && parent.PopopGrowth.notifyLimitReached) {
                    parent.PopopGrowth.notifyLimitReached();
                } else if (parent.PopopGrowth && parent.PopopGrowth.showModal) {
                    parent.PopopGrowth.showModal();
                } else {
                    parent.postMessage({ type: 'popop:trysee-limit' }, '*');
                }
            } catch (e) {}
        }

        function handleLimitReached() {
            if (isInsideApp()) {
                return;
            }
            if (dp.video.currentTime > LIMIT) {
                dp.seek(LIMIT);
            }
            dp.pause();
            if (!modalCooldown) {
                modalCooldown = true;
                notifyLimit();
                setTimeout(function () {
                    modalCooldown = false;
                }, 800);
            }
        }

        dp.on('timeupdate', function () {
            if (isInsideApp()) {
                return;
            }
            if (dp.video.currentTime >= LIMIT) {
                handleLimitReached();
            }
        });

        dp.on('seeking', function () {
            if (isInsideApp()) {
                return;
            }
            if (dp.video.currentTime > LIMIT) {
                dp.seek(LIMIT);
                handleLimitReached();
            }
        });

        dp.on('play', function () {
            if (isInsideApp()) {
                return;
            }
            if (dp.video.currentTime >= LIMIT) {
                dp.pause();
                dp.seek(LIMIT);
            }
        });
    })();

    function showCustomBuffering() {
    if(document.getElementById('customBuffer')) return;
        var iframe = document.createElement('iframe');
        iframe.src = parent.MacPlayer.Buffer || '/static/player/loading.html';
        iframe.style.cssText =
        'position:absolute;top:0;left:0;width:100%;height:100%;zindex:999;border:none;';
        iframe.id = 'customBuffer';
        document.body.appendChild(iframe);
    }
    function hideCustomBuffering() {
        var bufferFrame = document.getElementById('customBuffer');
        if(bufferFrame) bufferFrame.remove();
    }
    
	try{
		//document.getElementById('playerCnt').style.height = parent.MacPlayer.Height + 'px';
	}
	catch(e){}
</script>
</body>
</html>
