<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>iOS 安装</title>
    <style>
      :root {
        color-scheme: light;
        --bg: linear-gradient(180deg, #eef4ff 0%, #ffffff 100%);
        --card-bg: rgba(255, 255, 255, 0.92);
        --card-border: rgba(3, 70, 230, 0.12);
        --primary: #0346e6;
        --primary-strong: #0232a5;
        --text: #18213d;
        --muted: #5d6b8a;
        --warning-bg: #fff4d6;
        --warning-text: #7a5600;
        --note-bg: #f4f7ff;
        --shadow: 0 24px 60px rgba(3, 70, 230, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        display: grid;
        place-items: center;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .lang-switch {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: 16px;
        min-width: 88px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid rgba(3, 70, 230, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--primary);
        cursor: pointer;
        box-shadow: 0 12px 32px rgba(3, 70, 230, 0.12);
      }

      main {
        width: min(640px, 100%);
        padding: 32px 28px;
        border: 1px solid var(--card-border);
        border-radius: 28px;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(3, 70, 230, 0.08);
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 16px 0 10px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.1;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .env-banner {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        background: var(--warning-bg);
        color: var(--warning-text);
        font-size: 14px;
        line-height: 1.7;
      }

      .actions {
        margin-top: 24px;
        display: grid;
        gap: 12px;
      }

      .button-row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      button,
      a.link-button {
        min-height: 48px;
        border: 0;
        border-radius: 16px;
        font: inherit;
      }

      .primary-button,
      .secondary-button {
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .primary-button:hover,
      .secondary-button:hover {
        transform: translateY(-1px);
      }

      .primary-button {
        background: linear-gradient(135deg, var(--primary) 0%, #336bff 100%);
        color: #fff;
        box-shadow: 0 16px 28px rgba(3, 70, 230, 0.2);
      }

      .secondary-button {
        background: #eef3ff;
        color: var(--primary);
      }

      .secondary-button[hidden] {
        display: none;
      }

      .section {
        margin-top: 26px;
        padding: 22px 20px;
        border-radius: 22px;
        background: var(--note-bg);
      }

      .section h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      ol {
        margin: 0;
        padding-left: 20px;
      }

      li {
        line-height: 1.9;
        color: var(--text);
      }

      .note {
        margin-top: 14px;
        color: var(--muted);
        line-height: 1.8;
        font-size: 14px;
      }

      .status {
        min-height: 24px;
        margin: 18px 0 0;
        color: var(--primary-strong);
        font-size: 14px;
        line-height: 1.7;
      }

      .home-link {
        display: inline-flex;
        margin-top: 18px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 560px) {
        body {
          padding: 20px 12px;
        }

        main {
          padding: 24px 18px;
          border-radius: 24px;
        }

        .button-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="/lang-switch.js"></script>
  </head>
  <body>
    <button id="lang-toggle" class="lang-switch" type="button">EN</button>

    <main>
      <div id="channel-badge" class="eyebrow">iOS Channel 1</div>
      <h1 id="page-title">iOS Installation</h1>
      <p id="page-description" class="lead"></p>
      <div id="env-banner" class="env-banner"></div>

      <div class="actions">
        <button id="primary-action" class="primary-button" type="button"></button>
        <div class="button-row">
          <button id="copy-link" class="secondary-button" type="button"></button>
          <button id="open-safari" class="secondary-button" type="button"></button>
        </div>
      </div>

      <section class="section" aria-labelledby="steps-title">
        <h2 id="steps-title">Steps</h2>
        <ol id="steps-list"></ol>
        <p id="note-text" class="note"></p>
      </section>

      <section class="section" aria-labelledby="trust-title">
        <h2 id="trust-title">Trust the Certificate</h2>
        <ol id="trust-list"></ol>
      </section>

      <p id="status-message" class="status" aria-live="polite"></p>
      <a id="home-link" class="home-link" href="/">Back to Official Site</a>
    </main>

    <script src="/apple/install.js"></script>
  </body>
</html>
