<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>页面提示</title>
    <link rel="stylesheet" href="__STATIC__/css/home.css">
    <style>
        body{background:#F9FAFD;color:#818181;}
    </style>
    <link rel="stylesheet" href="../../../../static/css/home.css">
</head>
<body>
<div class="mac_msg_jump">
    <div class="msg_jump_tit"><?php echo !empty($msg) ? strip_tags($msg) : '页面跳转中...'; ?></div>
    <div class="title">页面提示</div>
    <div class="text">
        <?php echo !empty($msg) ? strip_tags($msg) : '页面正在跳转，请稍候...'; ?>
    </div>
    <div class="jump">
        页面自动 <a id="href" href="<?php echo($url);?>">跳转</a> 等待时间：<b id="wait"><?php echo($wait);?></b>
    </div>
</div>
<script type="text/javascript">
    (function(){
        var wait = document.getElementById('wait'),
                href = document.getElementById('href').href;
        var interval = setInterval(function(){
            var time = --wait.innerHTML;
            if(time <= 0) {
                location.href = href;
                clearInterval(interval);
            }
        }, 1000);
    })();
</script>
</body>
</html>
