{if condition="$for.is && $for.block eq 'vod_ad'"} 
{maccms:foreach name="$shoutu['ad']['data']" key="key" id="vo"}
{if condition="$for.type eq $key"}
<div class="ad-box">
    <div class="text-center">
        <a class="shoutu-ad-img" href="{$vo.url}"{if $vo.blank} target="_blank"{/if}{if $for.val} style="background-color:{$for.val};"{/if}>
            <img src="{$vo.img}" alt="{$vo.title}">
        </a>
    </div>
</div>
{/if}
{/maccms:foreach}
{/if}
